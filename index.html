<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter - Direct Downloader & Multi-Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-950 text-white font-sans overflow-x-hidden">

    <div id="splash-screen" class="fixed inset-0 bg-gray-950 flex flex-col items-center justify-center z-50 transition-opacity duration-700">
        <div class="relative w-24 h-24 flex items-center justify-center">
            <div class="absolute inset-0 border-4 border-t-emerald-500 border-r-transparent border-b-cyan-500 border-l-transparent rounded-full animate-spin"></div>
            <span class="text-4xl">🔄</span>
        </div>
        <h1 class="text-4xl font-extrabold mt-6 tracking-widest bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
            CONVERTER
        </h1>
        <p class="text-gray-500 text-sm mt-2">Instant Download & File Transformation</p>
    </div>

    <div id="main-content" class="hidden min-h-screen flex flex-col items-center p-4 md:p-6 max-w-4xl mx-auto opacity-0 transition-opacity duration-1000">
        
        <header class="text-center my-6">
            <h1 class="text-3xl font-black text-emerald-400 tracking-wide">🔄 CONVERTER</h1>
            <p class="text-gray-400 text-sm mt-1">Direct Social Media Downloader & Universal File Converter</p>
        </header>

        <div class="flex bg-gray-900 p-1.5 rounded-xl mb-6 w-full max-w-md shadow-lg border border-gray-800">
            <button id="tab-download" class="flex-1 py-2.5 rounded-lg font-medium bg-gradient-to-r from-emerald-500 to-cyan-500 text-white shadow-md transition-all" onclick="switchTab('download')">
                📥 Downloader
            </button>
            <button id="tab-convert" class="flex-1 py-2.5 rounded-lg font-medium text-gray-400 hover:text-white transition-all" onclick="switchTab('convert')">
                🔄 File Converter
            </button>
        </div>

        <div id="downloader-section" class="w-full bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl">
            <label class="block text-gray-400 text-sm font-medium mb-2">Paste Video Link (YouTube, FB, Insta, Twitter, Threads)</label>
            <div class="flex gap-2 mb-5">
                <input type="url" id="video-url" placeholder="https://example.com/video/..." class="flex-1 bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500 transition-all">
                <button onclick="pasteClipboard()" class="bg-gray-800 hover:bg-gray-700 px-4 rounded-xl text-sm font-medium border border-gray-700 transition-all">📋 Paste</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-gray-400 text-sm font-medium mb-2">Format</label>
                    <select id="video-format" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
                        <option value="mp4">MP4 (Video)</option>
                        <option value="mp3">MP3 (Audio)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-400 text-sm font-medium mb-2">Resolution / Quality</label>
                    <select id="video-quality" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
                        <option value="high">High Quality (1080p / 320kbps)</option>
                        <option value="medium">Medium Quality (720p / 192kbps)</option>
                        <option value="low">Low Quality (480p / 128kbps)</option>
                    </select>
                </div>
            </div>

            <button onclick="triggerDirectDownload()" class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 text-black font-bold py-3.5 rounded-xl hover:opacity-90 transition-all shadow-lg">
                ⏬ START DIRECT DOWNLOAD
            </button>
        </div>

        <div id="converter-section" class="w-full bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl hidden">
            <div class="border-2 border-dashed border-gray-700 hover:border-cyan-500 rounded-2xl p-8 text-center cursor-pointer mb-5 bg-gray-950/50 transition-all">
                <input type="file" id="file-input" class="hidden" onchange="handleFileSelect(this)">
                <label for="file-input" class="cursor-pointer">
                    <span class="text-4xl block mb-2">📁</span>
                    <span id="file-label" class="text-gray-400 font-medium">Drag & Drop or Click to Upload File</span>
                </label>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-gray-400 text-sm font-medium mb-2">Select Category</label>
                    <select id="file-category" onchange="updateFormats()" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
                        <option value="">-- Choose Category --</option>
                        <option value="document">Document Files</option>
                        <option value="image">Image Files</option>
                        <option value="audio">Audio Files</option>
                        <option value="video">Video Files</option>
                        <option value="spreadsheet">Spreadsheet Files</option>
                        <option value="presentation">Presentation Files</option>
                        <option value="archive">Archive Files</option>
                        <option value="ebook">E-Book Files</option>
                        <option value="font">Font Files</option>
                        <option value="cad">CAD Files</option>
                        <option value="3d">3D Model Files</option>
                        <option value="text">Text Files</option>
                        <option value="vector">Vector Graphics Files</option>
                        <option value="disk">Disk Image Files</option>
                        <option value="config">Configuration Files</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-400 text-sm font-medium mb-2">Target Format</label>
                    <select id="target-format" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
                        <option value="">-- Select Category First --</option>
                    </select>
                </div>
            </div>

            <button onclick="startDirectConversion()" class="w-full bg-gradient-to-r from-cyan-500 to-emerald-500 text-black font-bold py-3.5 rounded-xl hover:opacity-90 transition-all shadow-lg">
                🔄 CONVERT & DOWNLOAD NOW
            </button>
        </div>

        <div id="status-box" class="w-full mt-4 p-4 rounded-xl bg-gray-900 border border-gray-800 text-center hidden">
            <div id="loader-animation" class="inline-block w-6 h-6 border-2 border-t-emerald-400 border-gray-700 rounded-full animate-spin mb-2 hidden"></div>
            <p id="status-text" class="text-sm text-gray-300">Processing...</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
