name: Custom Private Downloader Engine
on:
  repository_dispatch:
    types: [process-video]

jobs:
  download_job:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies (FFmpeg & yt-dlp)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
        sudo chmod a+rx /usr/local/bin/yt-dlp

    - name: Extract and Process Media
      run: |
        URL="${{ github.event.client_payload.url }}"
        FORMAT="${{ github.event.client_payload.format }}"
        
        mkdir -p output_files
        if [ "$FORMAT" = "mp3" ]; then
          yt-dlp -x --audio-format mp3 --audio-quality 0 -o "output_files/download.%(ext)s" "$URL"
        else
          yt-dlp -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]" -o "output_files/download.%(ext)s" "$URL"
        fi

    - name: Upload File Directly to Your GitHub Site
      uses: softprops/action-gh-release@v2
      with:
        files: output_files/*
        tag_name: latest-download
        name: Active Download Stream
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
